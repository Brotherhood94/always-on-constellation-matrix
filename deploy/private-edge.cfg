defaults
  mode tcp
  timeout connect 5s
  timeout client 60s
  timeout server 60s

listen graph-browser
  mode http
  bind :7474
  compression algo-res gzip
  compression type-res text/css text/javascript application/javascript application/wasm
  server graph neo4j:7474 check

listen graph-bolt
  bind :7687
  server graph neo4j:7687 check

listen context-ingest
  mode http
  bind :8000
  http-request deny unless METH_POST
  http-request deny unless { path -m str /events }
  server context context:8000 check
