name: Verify Constellation
on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: agents/connector/package-lock.json
      - run: npm --prefix agents/connector ci --no-audit --no-fund
      - run: tests/unit
      - run: tests/dashboard-browser
      - run: tests/compose-smoke
      - run: tests/desktop-sftp
      - run: docker build -t constellation-office-connector:0.22.17 agents/connector
      - run: MATRIX_OPERATIONS_SMOKE=1 tests/synapse-smoke
      - run: bash integrations/root/tests/run
      - run: bash integrations/context-execution/tests/isolated
      - run: docker build -t matrix-telegram-connector:0.2.1 integrations/telegram
      - run: bash integrations/telegram/tests/bridge-smoke
      - run: docker build -t matrix-telegram-engine:0.1.2 integrations/telegram/engine
      - run: bash integrations/telegram/tests/engine-smoke
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: sudo env VERIFY_RESTIC=1 bash tests/install-smoke

  rootless-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Provision rootless Docker on the runner
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/docker.asc"
          sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/docker.asc
          printf '%s\n' 'Types: deb' 'URIs: https://download.docker.com/linux/ubuntu' \
            'Suites: noble' 'Components: stable' 'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/docker.asc' | sudo tee /etc/apt/sources.list.d/constellation-docker.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y uidmap slirp4netns docker-ce-rootless-extras
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dockerd-rootless-setuptool.sh install --force
          printf 'DOCKER_HOST=unix://%s/docker.sock\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Install and exercise the workspace as a regular user
        run: CONSTELLATION_ROOTLESS_SMOKE=1 VERIFY_RESTIC=1 bash tests/install-smoke

  persona-workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t constellation-office-connector:0.22.17 agents/connector
      - run: docker build -t constellation-amplifier-base:0.22.17 integrations/telegram/engine
      - run: docker build -t constellation-office-engine:0.22.17 -f agents/engine/Dockerfile .
      - run: docker build -t constellation-persona-workshop:0.7.4 integrations/chief-of-staff/persona
      - run: tests/workshop-smoke
