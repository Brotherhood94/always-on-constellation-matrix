name: matrix-telegram
x-worker: &worker
  restart: unless-stopped
  init: true
  user: '991:991'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cgroup_parent: ${MATRIX_SLICE-matrix-workload.slice}
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: '5m', max-file: '2'}
services:
  telegram-guide:
    <<: *worker
    build: ../../deploy/matrix/bot
    mem_limit: 256m
    networks: [matrix, database]
    environment:
      MATRIX_URL: http://synapse:8008
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-}
      MATRIX_OWNER: ${MATRIX_OWNER:-}
      STATE_DIR: /state
      TELEGRAM_GUIDE: 'true'
    volumes:
      - ${TELEGRAM_DATA:?}/guide:/state
  telegram-bridge:
    <<: *worker
    image: dock.mau.dev/mautrix/telegram:v26.11@sha256:fe78dbce96dca82f077371f429776ab1fee3b65ddc83924a257279b142160945
    entrypoint: [/usr/bin/mautrix-telegram, -n, -c, /data/config.yaml]
    working_dir: /data
    volumes:
      - ${TELEGRAM_DATA:?}/bridge:/data
    networks: [matrix, database, outbound]
    mem_limit: 512m
    healthcheck:
      test: [CMD, bash, -c, '</dev/tcp/127.0.0.1/29317']
      interval: 5s
      timeout: 3s
      retries: 18
  connector:
    <<: *worker
    profiles: [agent]
    image: matrix-telegram-connector:0.2.1
    build: .
    mem_limit: 384m
    networks: [matrix, database, engine, memory]
    environment:
      TELEGRAM_CONTEXT_ENABLED: ${TELEGRAM_CONTEXT_ENABLED:-false}
    volumes:
      - ${TELEGRAM_DATA:?}/connector:/state
      - ${TELEGRAM_CONTEXT_TOKEN:-/dev/null}:/context-token:ro
  telegram-engine:
    <<: *worker
    profiles: [agent]
    image: matrix-telegram-engine:0.1.2
    build: ./engine
    mem_limit: 1g
    environment:
      TELEGRAM_MODEL: ${TELEGRAM_MODEL:-gpt-6.2-sol}
    volumes:
      - ${TELEGRAM_DATA:?}/instance:/instance
      - ${TELEGRAM_DATA:?}/exchange:/exchange
    networks: [engine, provider, workshop]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /exchange/ca.pem, 'https://telegram-engine:19443/']
      interval: 5s
      timeout: 4s
      retries: 15
networks:
  provider:
  matrix:
    external: true
    name: ${TELEGRAM_MATRIX_NETWORK:-matrix-stack_clients}
  database:
    external: true
    name: ${TELEGRAM_DATABASE_NETWORK:-matrix-stack_database}
  outbound:
  engine:
    internal: true
  memory:
    name: ${TELEGRAM_MEMORY_NETWORK:-matrix-telegram-context}
    external: ${TELEGRAM_CONTEXT_ENABLED:-false}
  workshop:
    name: ${TELEGRAM_WORKSHOP_NETWORK:-matrix-telegram-workshop}
    external: ${TELEGRAM_WORKSHOP_ENABLED:-false}
